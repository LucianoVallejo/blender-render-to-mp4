name: Build Extension Repository

# Rebuilds repo/index.json (and the packaged .zip) whenever the extension
# source changes, and commits the result back to main. Blender fetches
# repo/index.json directly (via raw.githubusercontent.com) as a custom
# "Get Extensions" repository, so this is what makes in-Blender updates work.
#
# Deliberately does NOT depend on Blender itself (or a third-party action
# that installs it) — scripts/generate_repo.py builds the zip and the
# index.json with only the Python standard library, so the only actions
# used here are GitHub's own official ones.

on:
  push:
    branches: ["main"]
    paths:
      - "render_to_mp4/**"
      - "scripts/generate_repo.py"
      - ".github/workflows/build-repo.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate repository index
        run: python3 scripts/generate_repo.py

      - name: Commit updated repository files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add repo
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Rebuild extension repository index [skip ci]"
          git push
